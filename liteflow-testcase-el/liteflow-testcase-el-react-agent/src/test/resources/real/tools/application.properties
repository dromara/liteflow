liteflow.rule-source=real/tools/flow.el.xml
liteflow.print-banner=false

liteflow.agent.runtime.namespace=real-tools-test
liteflow.agent.defaults.max-iterations=8
liteflow.agent.logging.react-enabled=false
liteflow.agent.state-store.json-root=target/agent-state-real/tools

# §4.3 文件工具前置条件
liteflow.agent.workspace.root=target/wk/real_tools
liteflow.agent.workspace.trusted-local=true
liteflow.agent.workspace.auto-create=true

# §4.3 shell 工具：白名单模式（默认内置清单含 echo）
liteflow.agent.shell.mode=WHITELIST
