liteflow.rule-source=real/skills/flow.el.xml
liteflow.print-banner=false

liteflow.agent.runtime.namespace=real-skills-test
liteflow.agent.workspace.root=target/wk/real_skills
liteflow.agent.workspace.auto-create=true
liteflow.agent.harness.filesystem-backend=GUARDED_LOCAL
liteflow.agent.harness.trusted-local=true
liteflow.agent.shell.mode=DISABLED
liteflow.agent.defaults.max-iterations=8
liteflow.agent.logging.react-enabled=false
liteflow.agent.state-store.json-root=target/agent-state-real/skills
liteflow.agent.runtime.timeout=4m
