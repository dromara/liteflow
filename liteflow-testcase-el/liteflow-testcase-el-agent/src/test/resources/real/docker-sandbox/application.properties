liteflow.rule-source=real/docker-sandbox/flow.el.xml
liteflow.print-banner=false

liteflow.agent.application-name=real-docker-sandbox-test
liteflow.agent.harness.local.workspace-root=target/wk/real_docker_sandbox
liteflow.agent.harness.filesystem-backend=DOCKER
liteflow.agent.harness.docker.image=python:3.14-slim
liteflow.agent.harness.docker.workspace-root=/workspace
liteflow.agent.harness.docker.network=none
liteflow.agent.max-iterations=8
liteflow.agent.execution-log-enabled=false
liteflow.agent.session-store.json-root=target/agent-state-real/docker-sandbox
liteflow.agent.execution-timeout=6m
