liteflow.rule-source=real/docker-sandbox/flow.el.xml
liteflow.print-banner=false

liteflow.agent.runtime.namespace=real-docker-sandbox-test
liteflow.agent.workspace.root=target/wk/real_docker_sandbox
liteflow.agent.workspace.auto-create=true
liteflow.agent.harness.filesystem-backend=DOCKER
liteflow.agent.harness.docker.image=python:3.14-slim
liteflow.agent.harness.docker.workspace-root=/workspace
liteflow.agent.harness.docker.network=none
liteflow.agent.defaults.max-iterations=8
liteflow.agent.logging.enabled=false
liteflow.agent.state-store.json-root=target/agent-state-real/docker-sandbox
liteflow.agent.runtime.timeout=6m
