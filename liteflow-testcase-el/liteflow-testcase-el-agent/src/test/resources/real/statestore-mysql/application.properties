liteflow.rule-source=real/statestore-mysql/flow.el.xml
liteflow.print-banner=false

liteflow.agent.runtime.namespace=real-mysql-test
liteflow.agent.defaults.max-iterations=4
liteflow.agent.logging.enabled=false

liteflow.agent.state-store.type=MYSQL
liteflow.agent.state-store.mysql.jdbc-url=jdbc:mysql://localhost:13306/liteflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
liteflow.agent.state-store.mysql.username=root
liteflow.agent.state-store.mysql.password=root123456
liteflow.agent.state-store.mysql.database-name=liteflow
liteflow.agent.state-store.mysql.table-name=agent_state_real
liteflow.agent.state-store.mysql.create-if-not-exist=true
