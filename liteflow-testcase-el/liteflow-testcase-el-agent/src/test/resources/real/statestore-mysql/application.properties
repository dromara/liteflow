liteflow.rule-source=real/statestore-mysql/flow.el.xml
liteflow.print-banner=false

liteflow.agent.application-name=real-mysql-test
liteflow.agent.max-iterations=4
liteflow.agent.execution-log-enabled=false

liteflow.agent.session-store.type=MYSQL
liteflow.agent.session-store.mysql.jdbc-url=jdbc:mysql://localhost:13306/liteflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
liteflow.agent.session-store.mysql.username=root
liteflow.agent.session-store.mysql.password=root123456
liteflow.agent.session-store.mysql.database-name=liteflow
liteflow.agent.session-store.mysql.table-name=agent_state_real
liteflow.agent.session-store.mysql.create-if-not-exist=true

liteflow.agent.harness.local.workspace-root=target/wk/real_statestore-mysql
liteflow.agent.session-store.json-workspace-root=target/wk/real_statestore-mysql
