liteflow.rule-source=real/statestore-redis/flow.el.xml
liteflow.print-banner=false

liteflow.agent.application-name=real-redis-test
liteflow.agent.max-iterations=4
liteflow.agent.execution-log-enabled=false

liteflow.agent.session-store.type=REDIS
liteflow.agent.session-store.redis.uri=redis://localhost:16379
liteflow.agent.session-store.redis.key-prefix=liteflow:real:test:

liteflow.agent.harness.local.workspace-root=target/wk/real_statestore-redis
liteflow.agent.session-store.json-workspace-root=target/wk/real_statestore-redis
