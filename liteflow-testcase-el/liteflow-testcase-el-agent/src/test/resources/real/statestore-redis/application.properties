liteflow.rule-source=real/statestore-redis/flow.el.xml
liteflow.print-banner=false

liteflow.agent.runtime.namespace=real-redis-test
liteflow.agent.defaults.max-iterations=4
liteflow.agent.logging.enabled=false

liteflow.agent.state-store.type=REDIS
liteflow.agent.state-store.redis.uri=redis://localhost:16379
liteflow.agent.state-store.redis.key-prefix=liteflow:real:test:
