liteflow.rule-source=real/harness/flow.el.xml
liteflow.print-banner=false

liteflow.agent.runtime.namespace=real-harness-test
liteflow.agent.workspace.root=target/wk/real_harness
liteflow.agent.workspace.auto-create=true
liteflow.agent.harness.filesystem-backend=GUARDED_LOCAL
liteflow.agent.harness.trusted-local=true
# This suite explicitly exercises automatic memory extraction, which is opt-in.
liteflow.agent.harness.memory.flush-mode=ALWAYS
liteflow.agent.shell.mode=DISABLED
liteflow.agent.defaults.max-iterations=16
liteflow.agent.logging.enabled=false
liteflow.agent.state-store.json-root=target/agent-state-real/harness
liteflow.agent.runtime.timeout=5m
