liteflow.rule-source=real/harness/flow.el.xml
liteflow.print-banner=false

liteflow.agent.application-name=real-harness-test
liteflow.agent.harness.local.workspace-root=target/wk/real_harness
liteflow.agent.harness.filesystem-backend=GUARDED_LOCAL
# This suite explicitly exercises automatic memory extraction, which is opt-in.
liteflow.agent.harness.memory.flush-mode=ALWAYS
liteflow.agent.harness.shell.mode=DISABLED
liteflow.agent.max-iterations=16
liteflow.agent.execution-log-enabled=false
liteflow.agent.session-store.json-root=target/agent-state-real/harness
liteflow.agent.execution-timeout=5m
liteflow.agent.session-store.json-workspace-root=target/wk/real_harness
