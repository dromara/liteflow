liteflow.rule-source=real/tools/flow.el.xml
liteflow.print-banner=false

liteflow.agent.application-name=real-tools-test
liteflow.agent.max-iterations=8
liteflow.agent.execution-log-enabled=false
liteflow.agent.session-store.json-root=target/agent-state-real/tools

# §4.3 文件工具前置条件
liteflow.agent.harness.local.workspace-root=target/wk/real_tools

# §4.3 shell 工具：白名单模式（默认内置清单含 echo）
liteflow.agent.harness.shell.mode=WHITELIST
liteflow.agent.session-store.json-workspace-root=target/wk/real_tools
