liteflow.rule-source=feature/conversationid/flow.el.xml
liteflow.print-banner=false

# 默认测试使用进程内确定性模型，不读取真实 Provider 凭据。
liteflow.agent.harness.local.workspace-root=target/wk/feature_conversationid
liteflow.agent.harness.shell.mode=WHITELIST
liteflow.agent.max-iterations=6
liteflow.agent.execution-log-enabled=false
liteflow.agent.skills.enabled=false
liteflow.agent.session-store.json-root=target/agent-state

liteflow.agent.session-store.json-workspace-root=target/wk/feature_conversationid
