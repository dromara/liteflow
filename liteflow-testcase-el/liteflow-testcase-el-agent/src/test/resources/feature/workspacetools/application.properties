liteflow.rule-source=feature/workspacetools/flow.el.xml
liteflow.print-banner=false

# 本场景使用组件内 deterministic fake model，不访问网络。
liteflow.agent.harness.local.workspace-root=target/wk/feature_workspacetools
liteflow.agent.harness.shell.mode=WHITELIST
liteflow.agent.max-iterations=6
liteflow.agent.execution-log-enabled=false
liteflow.agent.skills.enabled=false
liteflow.agent.session-store.json-root=target/agent-state
liteflow.agent.session-store.json-workspace-root=target/wk/feature_workspacetools
