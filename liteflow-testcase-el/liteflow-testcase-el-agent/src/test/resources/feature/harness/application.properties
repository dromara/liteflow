liteflow.rule-source=feature/harness/flow.el.xml
liteflow.print-banner=false

# Entirely in-process: the component supplies a deterministic model and sandbox client.
liteflow.agent.runtime.namespace=harness-offline-test
liteflow.agent.workspace.root=target/wk/feature_harness
liteflow.agent.workspace.auto-create=true
liteflow.agent.shell.mode=disabled
liteflow.agent.defaults.max-iterations=4
liteflow.agent.logging.enabled=false
liteflow.agent.skills.enabled=false
liteflow.agent.harness.filesystem-backend=DOCKER
liteflow.agent.harness.docker.image=alpine:3.20
liteflow.agent.harness.docker.workspace-root=/workspace
liteflow.agent.harness.docker.memory-size-bytes=67108864
liteflow.agent.harness.docker.cpu-count=1
liteflow.agent.harness.docker.network=none
liteflow.agent.harness.docker.workspace-projection-enabled=false
liteflow.agent.state-store.json-root=target/agent-state
