liteflow.rule-source=feature/hitl/flow.el.xml
liteflow.print-banner=false
liteflow.agent.runtime.namespace=hitl-offline-test
liteflow.agent.runtime.timeout=5s
liteflow.agent.hitl.confirmation-timeout=2s
liteflow.agent.invocation-guard.mode=BEAN
liteflow.agent.invocation-guard.bean-name=hitlGuard
liteflow.agent.workspace.root=target/wk/feature_hitl
liteflow.agent.workspace.auto-create=true
liteflow.agent.shell.mode=disabled
liteflow.agent.defaults.max-iterations=4
liteflow.agent.logging.enabled=false
liteflow.agent.skills.enabled=false
liteflow.agent.state-store.json-root=target/agent-state
