liteflow.rule-source=feature/hitl/flow.el.xml
liteflow.print-banner=false
liteflow.agent.application-name=hitl-offline-test
liteflow.agent.execution-timeout=5s
liteflow.agent.hitl.confirmation-timeout=2s
liteflow.agent.invocation-guard.mode=BEAN
liteflow.agent.invocation-guard.bean-name=hitlGuard
liteflow.agent.harness.local.workspace-root=target/wk/feature_hitl
liteflow.agent.harness.shell.mode=WHITELIST
liteflow.agent.max-iterations=4
liteflow.agent.execution-log-enabled=false
liteflow.agent.skills.enabled=false
liteflow.agent.session-store.json-root=target/agent-state

liteflow.agent.session-store.json-workspace-root=target/wk/feature_hitl
