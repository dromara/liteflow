liteflow.rule-source=platform/openaicompatible/flow.el.xml
liteflow.print-banner=false

# 平台连通性测试：真实 baseUrl/apiKey/model 由环境变量提供，缺失即跳过。
# - LITEFLOW_AGENT_TEST_BASE_URL
# - LITEFLOW_AGENT_TEST_API_KEY
# - LITEFLOW_AGENT_TEST_MODEL（可选，默认 gpt-4o-mini）
liteflow.agent.harness.local.workspace-root=target/wk/platform_openaicompatible
liteflow.agent.harness.shell.mode=disabled
liteflow.agent.max-iterations=3
liteflow.agent.execution-log-enabled=false
liteflow.agent.skills.enabled=false
liteflow.agent.session-store.json-root=target/agent-state

liteflow.agent.session-store.json-workspace-root=target/wk/platform_openaicompatible
