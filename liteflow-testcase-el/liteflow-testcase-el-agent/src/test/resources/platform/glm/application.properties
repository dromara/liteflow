liteflow.rule-source=platform/glm/flow.el.xml
liteflow.print-banner=false

# 平台连通性测试：真实凭据由环境变量提供，缺失即跳过。
liteflow.agent.harness.local.workspace-root=target/wk/platform_glm
liteflow.agent.harness.shell.mode=disabled
liteflow.agent.max-iterations=3
liteflow.agent.execution-log-enabled=false
liteflow.agent.skills.enabled=false
liteflow.agent.session-store.json-root=target/agent-state

liteflow.agent.session-store.json-workspace-root=target/wk/platform_glm
